name: Deploy to GitHub Pages

# The public build of the game, for people who want to try it in a browser. It is
# the web build (npm run build:web): it keeps the game in the browser, which the
# Playables build may not. The bundle for YouTube is made from release/ with
# npm run package; the Playables build still runs here, so a change that breaks
# its certification checks fails this workflow before anything is published.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Playables build: typecheck, bundle limits and the banned-API check.
      - run: npm run build
      - run: npm test
      # What gets published. The assets are relative, so it works under /okey-playable/.
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
