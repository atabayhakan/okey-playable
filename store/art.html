<!doctype html>
<!-- Store art for the Playables portal: the game's own look, no logo, no text.
     Rendered by shoot-assets.mjs through Chrome and saved as PNG. Everything you see is the game's own CSS
     (index.css is the built stylesheet, copied next to this page): the felt is .table, the tiles are .tile,
     the walnut rack is .rack, the sunk slots are .discard, the pile is .pile. This page only places them.
     Light comes from above (docs/DESIGN.md): every shadow falls straight down, as in the game. -->
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./index.css" />
    <style>
      /* Placement only. No colours here: they all come from the game's tokens. */
      .art.table {
        display: block;
        padding: 0;
        overflow: hidden;
      }
      /* A still picture: the pulses and glows of the live game would be caught at a random frame. */
      .art *,
      .art *::before,
      .art *::after {
        animation: none !important;
        transition: none !important;
      }
      .stage {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: grid;
        place-items: center;
      }

      /* Three tiles fanned, as on the splash: the middle one in front, the two others open to the sides. */
      .fan {
        display: grid;
        place-items: center;
      }
      .fan > .tile {
        grid-area: 1 / 1;
      }
      .fan > .tile:nth-child(2) {
        z-index: 1;
      }
      .fan > .tile:first-child {
        transform: translate(-64%, 6%) rotate(-12deg);
      }
      .fan > .tile:last-child {
        transform: translate(64%, 6%) rotate(12deg);
      }

      /* The middle of the table: the pile and the indicator side by side. */
      .middle {
        display: flex;
        align-items: center;
        gap: calc(var(--btw) * 0.32);
      }
      .middle .tile {
        --tile-w: var(--btw);
      }
      .discard .tile {
        --tile-w: var(--btw);
      }
      .rack {
        width: fit-content;
      }
    </style>
  </head>
  <body>
    <div class="art table" id="art"></div>
    <script type="module">
      const art = document.getElementById('art');
      // The colour marks the game uses (COLOR_MARKS in src/ui/view.ts).
      const MARK = { red: '●', yellow: '▲', blue: '■', black: '◆' };
      const tile = (color, value, cls = '') =>
        `<div class="tile ${cls}" data-color="${color}"><span class="value">${value}</span><span class="mark">${MARK[color]}</span></div>`;
      const back = () => `<div class="tile back"></div>`;
      const gap = () => `<div class="slot gap"></div>`;
      const empty = () => `<div class="slot empty"></div>`;
      const size = (w, h) => {
        art.style.width = `${w}px`;
        art.style.height = `${h}px`;
      };

      // The indicator is the yellow 8, so the okey (the wild, with its brass stud) is the yellow 9: the art
      // follows the rules, as the game does.
      const views = {
        // The icon: a set of three fives fanned. Felt to the edge; the tiles stay inside the middle 68%,
        // so a launcher that cuts the icon to a circle (maskable) leaves them whole.
        icon: () => {
          size(512, 512);
          art.innerHTML = `<div class="stage" style="--tile-w:124px">
            <div class="fan" style="transform:translateY(-3%)">
              ${tile('blue', '5')}
              ${tile('red', '5')}
              ${tile('black', '5')}
            </div>
          </div>`;
        },
        // The cover: the table from above. The pile and the indicator in the middle, a tile in each of the
        // four sunk discard slots (the corners, as in the game), and the player's walnut rack at the bottom with a run, a set and the okey, one tile lifted.
        cover: () => {
          size(1280, 720);
          art.innerHTML = `<div class="stage" style="grid-template-rows:1fr auto;padding:40px 60px 46px;gap:26px;--btw:92px">
            <div style="position:relative;width:100%;height:100%;display:grid;place-items:center">
              <div class="middle">
                <button class="pile" disabled tabindex="-1">${back()}</button>
                <div class="indicator">${tile('yellow', '8')}</div>
              </div>
              <div class="discard" style="position:absolute;left:170px;top:8px">${tile('black', '11')}</div>
              <div class="discard" style="position:absolute;right:170px;top:8px">${tile('blue', '12')}</div>
              <div class="discard" style="position:absolute;left:170px;bottom:8px">${tile('yellow', '1')}</div>
              <div class="discard" style="position:absolute;right:170px;bottom:8px">${tile('red', '3')}</div>
            </div>
            <div class="rack" style="--tile-w:84px;--cols:21">
              ${tile('red', '4')}${tile('red', '5')}${tile('red', '6')}${tile('red', '7')}${gap()}
              ${tile('blue', '10')}${tile('black', '10')}${tile('red', '10')}${gap()}
              ${tile('yellow', '9', 'wild')}${gap()}
              ${tile('black', '2', 'selected')}
            </div>
          </div>`;
        },
        // The portrait cover for the vertical placements: the fan, the middle of the table, and a full
        // two-row rack.
        portrait: () => {
          size(1080, 1920);
          art.innerHTML = `<div class="stage" style="grid-template-rows:auto auto auto;align-content:center;padding:0 80px;gap:150px">
            <div class="fan" style="--tile-w:196px">
              ${tile('blue', '5')}
              ${tile('red', '5')}
              ${tile('black', '5')}
            </div>
            <div class="middle" style="--btw:132px">
              <button class="pile" disabled tabindex="-1">${back()}</button>
              <div class="indicator">${tile('yellow', '8')}</div>
            </div>
            <div class="rack" style="--tile-w:150px;--cols:10">
              ${tile('red', '4')}${tile('red', '5')}${tile('red', '6')}${tile('red', '7')}${tile('red', '8')}
              ${tile('blue', '10')}${tile('black', '10')}${tile('red', '10')}${gap()}${tile('yellow', '9', 'wild')}
            </div>
          </div>`;
        },
      };

      const view = new URLSearchParams(location.search).get('view') ?? 'icon';
      views[view]();
      // The tile numbers are in the bundled font: wait for it, or the picture is taken in a fallback face.
      await document.fonts.load('800 40px "Plus Jakarta Sans Variable"', '0123456789');
      await document.fonts.ready;
      document.title = `ready-${view}`;
    </script>
  </body>
</html>
